appId: com.tm.studio
productName: TMCut Studio
directories:
  output: release
  buildResources: public
publish:
  provider: github
  owner: tuanmjnh
  repo: tm-studio
  releaseType: release
files:
  - electron/**/*
  # The `#shared/*` tree (the imports map in package.json) that app/ and server/
  # import. Slice I deleted its only `.cjs` — shared/utils/detection-args.cjs, the
  # AutoCut ffmpeg argv — once both callers (the Electron controller and
  # server/api/v1/media/analyze.post.ts) were gone: this entry ships the tree
  # verbatim, so an uncalled argv builder would still be FFmpeg in the release.
  - shared/**/*
  # The main process reads the core from the package: video-generation/controller.mjs
  # imports the adapter registries from tm-cut-core, the same artifact the app and
  # the tests resolve through the package exports — one engine, one copy (G13).
  # The tarball is the contents of dist, so this path is flat: there is no src/.
  - node_modules/tm-cut-core/**/*
  - .output/**/*
  - public/icon.ico
  - public/icon.png
  - package.json
asarUnpack:
  - .output/server/**
extraResources:
  - from: resources
    to: resources
    filter:
      # Media work runs in WebCodecs/mediabunny (ADR-028); the only executable
      # left in resources is the yt-dlp downloader, resolved at runtime.
      - "yt-dlp.exe"
      - "**/*.json"
      - "**/*.node"
      # Asset Center starter catalog sample media:
      # bundled starter files install offline with checksum verification.
      - "tmcut-catalog/**"
win:
  icon: public/icon.ico
  executableName: TMCut Studio
  target:
    - nsis
nsis:
  oneClick: false
  installerIcon: public/icon.ico
  uninstallerIcon: public/icon.ico
  installerHeaderIcon: public/icon.ico
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  allowToChangeInstallationDirectory: true
mac:
  target:
    - dmg
linux:
  icon: public/icon.png
  target:
    - AppImage
    - deb
  maintainer: electronjs.org
  category: Video
npmRebuild: false
